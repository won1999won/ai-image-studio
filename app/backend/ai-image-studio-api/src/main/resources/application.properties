spring.application.name=ai-image-studio-api
app.jwt.secret=change-this-to-a-long-random-string-at-least-32chars
app.jwt.expMinutes=60
# H2 인메모리 DB (개발용)
spring.datasource.url=jdbc:h2:mem:devdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 콘솔(선택): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 스케줄링 스레드 수 (기본 1)
spring.task.scheduling.pool.size=2
# 로그 보고 싶으면
logging.level.com.example.aiimagestudio.job=INFO
